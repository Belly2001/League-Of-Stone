<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>League of Stones</title>
</head>
<body>
    <!-- Header -->
    <header>
        <label>League of Stones</label>
    </header>
    
    <!-- Zone Adversaire (Player 2) -->
    <section class="player-zone" id="player2-zone">
        <!-- Portrait Player 2 à gauche -->
        <div class="portrait">
            <img src="images/kev.jpg" alt="Player 2">
            <p>Player 2</p>
        </div>
        
        <!-- Cartes adversaire (1 carte) -->
        <div class="cards-container">
            <div class="card-champion">
                <div class="card-inner">
                    <div class="card-front">
                        <img src="images/Ivern_0.jpg" alt="Thresh">
                        <p>Thresh</p>
                    </div>
                    <div class="card-back">
                        <p>⚔️ ATK: 60</p>
                        <p>🛡️ DEF: 40</p>
                        <p>❤️ HP: 120</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Ligne de séparation -->
    <hr class="separator">
    
    <!-- Zone Joueur (Player 1) -->
    <section class="player-zone" id="player1-zone">
        <!-- Portrait Player 1 à gauche -->
        <div class="portrait">
            <img src="images/carl.jpg" alt="Player 1">
            <p>Player 1</p>
        </div>
        
        <!-- Cartes joueur (2 cartes) -->
        <div class="cards-container">
            <!-- Carte Teemo -->
            <div class="card-champion">
                <div class="card-inner">
                    <div class="card-front">
                        <img src="images/Teemo_0.jpg" alt="Teemo">
                        <p>Teemo</p>
                    </div>
                    <div class="card-back">
                        <p>⚔️ ATK: 50</p>
                        <p>🛡️ DEF: 30</p>
                        <p>❤️ HP: 100</p>
                    </div>
                </div>
            </div>
            <!-- Carte Taric -->
            <div class="card-champion">
                <div class="card-inner">
                    <div class="card-front">
                        <img src="images/Taric_0.jpg" alt="Taric">
                        <p>Taric</p>
                    </div>
                    <div class="card-back">
                        <p>⚔️ ATK: 45</p>
                        <p>🛡️ DEF: 70</p>
                        <p>❤️ HP: 150</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Footer -->
    <footer>
        <p>Copyright © Web2 L3 UT2J</p>
    </footer>
</body>
</html>
